# /etc/nginx/sites-available/api.mysuperhero.xyz
#
# Depends on the upstreams, the $connection_upgrade map and the limit_req zones
# defined in Realtime/deploy/nginx.conf. Install that first or `nginx -t` fails.

server {
    listen 80;
    listen [::]:80;
    server_name api.mysuperhero.xyz;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # `listen ... http2` rather than the nginx 1.25.1+ `http2 on;` directive:
    # Ubuntu 22.04 ships 1.18, which does not understand the newer form.
    # Check `nginx -v` before switching.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.mysuperhero.xyz;

    # This host's active Certbot lineage is the -0001 directory (the original
    # lineage was replaced during certificate recovery). Keep this aligned with
    # `certbot certificates`; nginx must never be reloaded against a guessed path.
    ssl_certificate     /etc/letsencrypt/live/api.mysuperhero.xyz-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.mysuperhero.xyz-0001/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # No `preload` — that is effectively irreversible and every
    # *.mysuperhero.xyz host would have to stay HTTPS-only forever.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Matches spring.servlet.multipart.max-request-size (12MB) plus overhead.
    client_max_body_size 15M;
    limit_conn api_conn 40;

    proxy_buffering on;
    proxy_buffers 16 8k;
    proxy_buffer_size 8k;
    proxy_busy_buffers_size 16k;

    location /socket.io/ {
        proxy_pass http://superheroo_realtime;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        # Above the gateway's 25s ping interval / 20s ping timeout.
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        # Streaming transport: buffering only adds latency.
        proxy_buffering off;
        # Generous, because the polling fallback issues many requests per
        # connection. If 429s show up in the gateway logs, drop this line —
        # the gateway authenticates every socket itself.
        limit_req zone=api_general burst=50 nodelay;
    }

    location = /realtime/health {
        proxy_pass http://superheroo_realtime/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        access_log off;
    }

    # OTP, login and refresh get their own much tighter bucket. These are the
    # endpoints worth flooding.
    location ~ ^/api/v1/auth/(otp|password/login|refresh) {
        limit_req zone=api_auth burst=5 nodelay;
        proxy_pass http://superheroo_api;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Metrics carry no authentication of their own. Keep them on the box for
    # a local Prometheus scrape.
    location = /actuator/prometheus {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://superheroo_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    location / {
        limit_req zone=api_general burst=50 nodelay;
        proxy_pass http://superheroo_api;
        proxy_http_version 1.1;
        # Required for upstream keepalive. Without it nginx forwards the
        # client's Connection header and the pooled connection is torn down
        # after every request, defeating the upstream block entirely.
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        # Was 30s. The app is on loopback: if it cannot accept in 5s it is down.
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503;
    }
}
