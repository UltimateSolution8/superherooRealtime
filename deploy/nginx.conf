# /etc/nginx/nginx.conf — Superherooo edge.
#
# This file exists because none of the http{}-level tuning was version
# controlled: worker counts, gzip, TLS session reuse, upstream keepalive and
# rate limiting were all whatever the distro shipped. The site config
# (nginx-api-site.conf) depends on the upstreams, the $connection_upgrade map
# and the limit_req zones defined here.
#
# Install:  sudo cp nginx.conf /etc/nginx/nginx.conf && sudo nginx -t && sudo systemctl reload nginx

user  www-data;
# 2 workers on a 2 vCPU droplet.
worker_processes  auto;
worker_rlimit_nofile 65535;
pid /run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    server_tokens off;

    keepalive_timeout 65s;
    keepalive_requests 1000;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    reset_timedout_connection on;

    # Aligned with spring.servlet.multipart.max-request-size (12MB) plus
    # multipart overhead. Was 50M, so an oversize upload was accepted at the
    # edge, streamed in full, and only then rejected by the application.
    client_max_body_size 15M;
    client_body_buffer_size 128k;

    # $request_time / $upstream_response_time are what make the access log
    # useful for latency triage.
    log_format perf '$remote_addr - $status $request_time $upstream_response_time '
                    '"$request" $body_bytes_sent "$http_user_agent"';
    access_log /var/log/nginx/access.log perf buffer=32k flush=5s;
    error_log  /var/log/nginx/error.log warn;

    # Compression moved here from Tomcat (server.compression.enabled is now
    # false): nginx does it more cheaply, and doing it in both places wastes CPU
    # since nginx will not re-compress an already-encoded response.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    # text/html is always gzipped; listing it here would be a no-op.
    gzip_types application/json application/javascript application/xml
               text/css text/plain text/xml image/svg+xml;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    # Session reuse matters most for mobile clients on flaky networks that
    # reconnect often — each full handshake is a round trip they pay for.
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;

    # Edge rate limiting. The application also rate-limits per IP in
    # RateLimitFilter; this stops the cheap floods before they reach the JVM.
    # 10m holds roughly 160k distinct addresses.
    limit_req_zone  $binary_remote_addr zone=api_general:10m rate=25r/s;
    limit_req_zone  $binary_remote_addr zone=api_auth:10m    rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=api_conn:10m;
    limit_req_status 429;
    limit_conn_status 429;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Upstreams exist purely for `keepalive`. Without them nginx opens a new TCP
    # connection to the app for every single proxied request.
    upstream superheroo_api {
        server 127.0.0.1:8081 max_fails=3 fail_timeout=10s;
        keepalive 32;
        keepalive_requests 1000;
        keepalive_timeout 60s;
    }

    upstream superheroo_realtime {
        server 127.0.0.1:8090 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
